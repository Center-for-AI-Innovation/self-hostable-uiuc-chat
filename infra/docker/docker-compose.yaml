services:
  redis:
    image: redis:7.2
    restart: unless-stopped
    command: redis-server --requirepass ${INGEST_REDIS_PASSWORD}
    #    ports:
    #       - 6379:6379
    networks:
      - uiuc-chat-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s # Optional: Time to wait before starting health checks

  qdrant:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - qdrant-data:/qdrant/storage
      - ./qdrant_config.yaml:/qdrant/config/production.yaml # Mount the config file directly as a volume
    networks:
      - uiuc-chat-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s # Give Qdrant time to start before health checks begin

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001" --address ":9000"
    ports:
      - "9000:9000" # MinIO API port
      - "9001:9001" # MinIO Console port (note: Console deprecated Q4 2024)
    networks:
      - uiuc-chat-network
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    networks:
      - uiuc-chat-network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-uiuc-chat}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY"
        mc mb -p "local/$$S3_BUCKET_NAME" || true

  crawlee:
    platform: linux/amd64
    build: ./apps/crawlee
    container_name: ic_crawlee
    networks:
      - uiuc-chat-network
    volumes:
      - ./data:/data
    ports:
      - "${CRAWLEE_PORT:-3345}:3000"
    env_file:
      - .env
    environment:
      INGEST_URL: http://backend:8001/ingest
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_KEY: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-uiuc-chat}
      MINIO_ENDPOINT: http://minio:9000
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /pw-browsers/chrome
    depends_on:
      backend:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  postgres-illinois-chat:
    # pgvector-enabled Postgres — required by the embeddings table and the
    # external-connections feature (init-schema.sql runs CREATE EXTENSION vector).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    networks:
      - uiuc-chat-network
    volumes:
      - postgres-illinois-chat:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres
    restart: unless-stopped
    networks:
      - uiuc-chat-network
    volumes:
      - postgres-keycloak:/var/lib/postgresql
    ports:
      - "${KEYCLOAK_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    #    ports:
    #      - "5672:5672"
    #      - "15672:15672"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5672"]
      interval: 3s
      timeout: 10s
      retries: 3
    networks:
      - uiuc-chat-network
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  keycloak:
    platform: linux/amd64 # M chip
    image: quay.io/keycloak/keycloak:26.1
    entrypoint: /bin/bash
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - uiuc-chat-network
    depends_on:
      - postgres-keycloak
    command:
      - -lc
      - |
        /opt/keycloak/bin/kc.sh start-dev --http-enabled=true --hostname=localhost --hostname-strict=false --db=postgres --db-url=jdbc:postgresql://postgres-keycloak:5432/${POSTGRES_DATABASE:-postgres} --db-username=${POSTGRES_USER:-postgres} --db-password=${POSTGRES_PASSWORD} --import-realm &
        pid=$$!
        until bash -c '</dev/tcp/localhost/8080' 2>/dev/null; do sleep 2; done
        until /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user "${KEYCLOAK_ADMIN_USERNAME:-admin}" --password "${KEYCLOAK_ADMIN_PASSWORD}"; do sleep 2; done
        /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=none
        wait "$$pid"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_METRICS_ENABLED=true
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./infra/keycloak/theme:/opt/keycloak/themes/keywind
      - ./infra/keycloak/realms:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s # Give Keycloak time to start up before checking

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KEYCLOAK_REALM: illinois_chat_realm
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: illinois_chat
        NEXT_PUBLIC_USE_ILLINOIS_CHAT_CONFIG: "True"
        NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8080/"
        NEXT_PUBLIC_S3_ENDPOINT: "http://localhost:9000"
        #NEXT_PUBLIC_SIGNING_KEY=""
    #        NEXT_PUBLIC_ILLINOIS_CHAT_BANNER_CONTENT: ""
    #        NEXT_PUBLIC_POSTHOG_KEY: ""
    #        NEXT_PUBLIC_POSTHOG_HOST: ""
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - uiuc-chat-network
    environment:
      # backend
      RAILWAY_URL: "http://backend:8001"
      INGEST_URL: "http://backend:8001/ingest"
      CRAWLEE_API_URL: "http://crawlee:3000/crawl"
      #redis
      REDIS_URL: "redis://default:${INGEST_REDIS_PASSWORD}@redis:6379"
      # Server-side Keycloak URL (for container-to-container communication)
      KEYCLOAK_URL: "http://keycloak:8080/"
      # NEXT_PUBLIC_KEYCLOAK_URL is already set in .env.prod for browser-side code
      # PostgreSQL connection settings (required for server-side database access)
      POSTGRES_ENDPOINT: postgres-illinois-chat
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
      POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL: "false"
      # Keycloak PostgreSQL connection settings
      KEYCLOAK_DB_ENDPOINT: postgres-keycloak
      KEYCLOAK_DB_PORT: 5432
      KEYCLOAK_DB_DATABASE: ${POSTGRES_DATABASE:-postgres}
      KEYCLOAK_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KEYCLOAK_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_SSL: "false"
      # MinIO configuration
      LOCAL_MINIO: true
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_KEY: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-uiuc-chat}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      # qdrant
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-illinois_chat}
      QDRANT_URL: http://qdrant:6333
      # project external connections (per-project S3/Postgres/Qdrant/embeddings)
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      ALLOWED_EMBEDDING_PROVIDERS: ${ALLOWED_EMBEDDING_PROVIDERS:-openai,ollama}
      # Sim AI
      SIM_API_BASE_URL: ${SIM_API_BASE_URL:-http://simstudio:3000}
      # llms
      OLLAMA_SERVER_URL: ${OLLAMA_SERVER_URL:-}
      NCSA_HOSTED_VLM_BASE_URL: ${NCSA_HOSTED_VLM_BASE_URL:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-http://host.docker.internal:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      NCSA_HOSTED_API_KEY: ${NCSA_HOSTED_API_KEY:-}
    depends_on:
      keycloak:
        condition: service_healthy
      postgres-illinois-chat:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  backend:
    platform: linux/arm64/v8
    build:
      context: ./apps/backend
      dockerfile: Self-Hosted-Dockerfile
    restart: unless-stopped
    networks:
      - uiuc-chat-network
    #    ports:
    #      - "8000:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-illinois-chat:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      REDIS_URL: "redis://default:${INGEST_REDIS_PASSWORD}@redis:6379"
      KV_REST_API_TOKEN: ${INGEST_REDIS_PASSWORD}
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672"
      POSTGRES_ENDPOINT: postgres-illinois-chat
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
      POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # qdrant
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-illinois_chat}
      QDRANT_URL: http://qdrant:6333
      # MinIO configuration
      LOCAL_MINIO: true
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_KEY: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-uiuc-chat}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      # project external connections (per-project S3/Postgres/Qdrant/embeddings)
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      ALLOWED_EMBEDDING_PROVIDERS: ${ALLOWED_EMBEDDING_PROVIDERS:-openai,ollama}
      # llm
      OLLAMA_SERVER_URL: ${OLLAMA_SERVER_URL}
      NCSA_HOSTED_VLM_BASE_URL: ${NCSA_HOSTED_VLM_BASE_URL}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      NCSA_HOSTED_API_KEY: ${NCSA_HOSTED_API_KEY}
      # other
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-not_a_key}

  worker:
    build:
      context: ./apps/backend/ai_ta_backend/rabbitmq
      dockerfile: Dockerfile
    restart: unless-stopped
    #    ports:
    #      - "8001:8001"
    networks:
      - uiuc-chat-network
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672"
      POSTGRES_ENDPOINT: postgres-illinois-chat
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
      POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_DATABASE: ${POSTGRES_DATABASE:-postgres}
      KEYCLOAK_DB_USERNAME: ${POSTGRES_USER:-postgres}
      # qdrant
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-illinois_chat}
      QDRANT_URL: http://qdrant:6333
      # MinIO configuration
      LOCAL_MINIO: true
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MINIO_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-uiuc-chat}
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      # project external connections (per-project S3/Postgres/Qdrant/embeddings)
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      ALLOWED_EMBEDDING_PROVIDERS: ${ALLOWED_EMBEDDING_PROVIDERS:-openai,ollama}
      # llm
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-http://host.docker.internal:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      NCSA_HOSTED_API_KEY: ${NCSA_HOSTED_API_KEY:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-illinois-chat:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

# declare the network resource
# this will allow you to use service discovery and address a container by its name from within the network
networks:
  uiuc-chat-network:
    driver: bridge

volumes:
  redis-data: {}
  qdrant-data: {}
  minio-data: {}
  postgres-illinois-chat: {}
  postgres-keycloak: {}
  rabbitmq: {}
