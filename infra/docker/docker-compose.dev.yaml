services:
  redis:
    image: redis:7.2
    command: redis-server --requirepass ${INGEST_REDIS_PASSWORD}
    ports:
      - 6379:6379
    networks:
      - uiuc-chat-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.9.0
    # environment:
    #   - QDRANT_API_KEY=${QDRANT_API_KEY}
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - qdrant-data:/qdrant/storage
      - ./qdrant_config.yaml:/qdrant/config/production.yaml # Mount the config file directly as a volume
    networks:
      - uiuc-chat-network
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    # Customize env vars in .env file
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_API_PORT: ${DOCKER_INTERNAL_MINIO_API_PORT:-10000}
      MINIO_CONSOLE_PORT: ${DOCKER_INTERNAL_MINIO_DASHBOARD_PORT:-9001}
    command: server /data --console-address ":${DOCKER_INTERNAL_MINIO_DASHBOARD_PORT:-9001}" --address ":${DOCKER_INTERNAL_MINIO_API_PORT:-10000}"
    ports:
      - ${PUBLIC_MINIO_API_PORT:-10000}:${DOCKER_INTERNAL_MINIO_API_PORT:-10000} # API access
      - ${PUBLIC_MINIO_DASHBOARD_PORT:-9001}:${DOCKER_INTERNAL_MINIO_DASHBOARD_PORT:-9001} # Dashboard access
    expose:
      - ${PUBLIC_MINIO_API_PORT:-10000}
      - ${PUBLIC_MINIO_DASHBOARD_PORT:-9001}
    networks:
      - uiuc-chat-network
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/${DOCKER_INTERNAL_MINIO_API_PORT:-10000}' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # crawlee:
  #   build: ./apps/crawlee
  #   platform: linux/amd64  # M chip
  #   networks:
  #     - uiuc-chat-network
  #   volumes:
  #     - ./data:/data
  #   ports:
  #     - "3345:3000"
  #   env_file:
  #     - .env
  #   environment:
  #     - INGEST_URL=http://backend:8001/ingest
  #   depends_on:
  #     - redis

  postgres-illinois-chat:
    # pgvector-enabled Postgres — required by the embeddings table and the
    # external-connections feature (init-schema.sql runs CREATE EXTENSION vector).
    image: pgvector/pgvector:pg17
    networks:
      - uiuc-chat-network
    volumes:
      # Must land exactly on PGDATA. This image declares VOLUME
      # /var/lib/postgresql/data, so mounting the parent (/var/lib/postgresql)
      # lets Docker shadow it with an anonymous volume — the real data then dies
      # with the container on every `compose down`. Keep this path in sync with
      # the image's PGDATA, as sim-db already does.
      - postgres-illinois-chat:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    # Pinned to a major on purpose: PGDATA is /var/lib/postgresql/<major>/docker,
    # so letting `latest` roll to the next major would point at an uninitialized
    # path and strand the existing cluster inside the volume.
    image: postgres:18
    networks:
      - uiuc-chat-network
    volumes:
      - postgres-keycloak:/var/lib/postgresql
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5672"]
      interval: 3s
      timeout: 10s
      retries: 3
    networks:
      - uiuc-chat-network
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  keycloak:
    platform: linux/amd64 # M chip
    image: quay.io/keycloak/keycloak:26.1
    entrypoint: /bin/bash
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - uiuc-chat-network
    command:
      - -lc
      - |
        /opt/keycloak/bin/kc.sh start-dev --http-enabled=true --hostname=localhost --hostname-strict=false --db=postgres --db-url=jdbc:postgresql://postgres-keycloak:5432/postgres --db-username=${POSTGRES_USER:-postgres} --db-password=${POSTGRES_PASSWORD:-password} --import-realm &
        pid=$$!
        until bash -c '</dev/tcp/localhost/8080' 2>/dev/null; do sleep 2; done
        until /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user "${KEYCLOAK_ADMIN_USERNAME:-admin}" --password "${KEYCLOAK_ADMIN_PASSWORD:-admin}"; do sleep 2; done
        /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=none
        wait "$$pid"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_METRICS_ENABLED=true
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./infra/keycloak/theme:/opt/keycloak/themes/keywind
      - ./infra/keycloak/realms:/opt/keycloak/data/import
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      # Keycloak needs ~2min to boot here: JVM start plus realm import, slowed
      # further by amd64 emulation on Apple Silicon. Without start_period those
      # boot-time failures burn the retry budget and compose aborts dependents
      # with "container ... is unhealthy" seconds before port 8080 opens.
      start_period: 240s
      interval: 5s
      timeout: 10s
      retries: 3

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    ports:
      - "4983:4983"
    networks:
      - uiuc-chat-network
    volumes:
      - drizzle-gateway:/app/drizzle-gateway-volume
    environment:
      - PORT=4983
      - STORE_PATH=/app/drizzle-gateway-volume
      - MASTERPASS=${DRIZZLE_MASTERPASS:-your_master_password}
    depends_on:
      postgres-illinois-chat:
        condition: service_healthy

# declare the network resource
# this will allow you to use service discovery and address a container by its name from within the network
networks:
  uiuc-chat-network:
    driver: bridge

volumes:
  redis-data: {}
  qdrant-data: {}
  minio-data: {}
  postgres-illinois-chat: {}
  postgres-keycloak: {}
  rabbitmq: {}
  ollama-data: {}
  drizzle-gateway: {}
