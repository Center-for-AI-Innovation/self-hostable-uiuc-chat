services:
  simstudio:
    image: ghcr.io/simstudioai/simstudio:${SIM_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${SIM_APP_PORT:-3010}:3000"
    networks:
      - uiuc-chat-network
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${SIM_POSTGRES_USER:-postgres}:${SIM_POSTGRES_PASSWORD}@sim-db:5432/${SIM_POSTGRES_DB:-simstudio}
      BETTER_AUTH_URL: ${SIM_NEXT_PUBLIC_APP_URL:-http://localhost:3010}
      NEXT_PUBLIC_APP_URL: ${SIM_NEXT_PUBLIC_APP_URL:-http://localhost:3010}
      BETTER_AUTH_SECRET: ${SIM_BETTER_AUTH_SECRET:-sim-dev-secret-at-least-32-characters}
      ENCRYPTION_KEY: ${SIM_ENCRYPTION_KEY:-sim-dev-encryption-key-at-least-32-chars}
      API_ENCRYPTION_KEY: ${SIM_API_ENCRYPTION_KEY:-}
      INTERNAL_API_SECRET: ${SIM_INTERNAL_API_SECRET:-sim-dev-internal-api-secret-32-chars}
      REDIS_URL: ${SIM_REDIS_URL:-}
      SOCKET_SERVER_URL: http://sim-realtime:3002
      NEXT_PUBLIC_SOCKET_URL: ${SIM_NEXT_PUBLIC_SOCKET_URL:-http://localhost:3011}
      SSO_ENABLED: "true"
      NEXT_PUBLIC_SSO_ENABLED: "true"
      SSO_PROVIDER_ID: ${SIM_SSO_PROVIDER_ID:-uiuc-keycloak}
      SSO_TRUSTED_PROVIDER_IDS: ${SIM_SSO_PROVIDER_ID:-uiuc-keycloak}
      TRUSTED_ORIGINS: ${SIM_TRUSTED_ORIGINS:-http://localhost:3010,http://localhost:3011,http://keycloak:8080}
    depends_on:
      sim-db:
        condition: service_healthy
      sim-migrations:
        condition: service_completed_successfully
      sim-approval-setup:
        condition: service_completed_successfully
      sim-keycloak-setup:
        condition: service_completed_successfully
      sim-sso-setup:
        condition: service_completed_successfully
      sim-realtime:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "const response = await fetch(''http://127.0.0.1:3000/api/auth/get-session''); process.exit(response.ok ? 0 : 1)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s

  sim-realtime:
    image: ghcr.io/simstudioai/realtime:${SIM_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${SIM_REALTIME_PORT:-3011}:3002"
    networks:
      - uiuc-chat-network
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${SIM_POSTGRES_USER:-postgres}:${SIM_POSTGRES_PASSWORD}@sim-db:5432/${SIM_POSTGRES_DB:-simstudio}
      NEXT_PUBLIC_APP_URL: ${SIM_NEXT_PUBLIC_APP_URL:-http://localhost:3010}
      BETTER_AUTH_URL: ${SIM_NEXT_PUBLIC_APP_URL:-http://localhost:3010}
      BETTER_AUTH_SECRET: ${SIM_BETTER_AUTH_SECRET:-sim-dev-secret-at-least-32-characters}
      INTERNAL_API_SECRET: ${SIM_INTERNAL_API_SECRET:-sim-dev-internal-api-secret-32-chars}
      REDIS_URL: ${SIM_REDIS_URL:-}
    depends_on:
      sim-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s

  sim-migrations:
    image: ghcr.io/simstudioai/migrations:${SIM_IMAGE_TAG:-latest}
    networks:
      - uiuc-chat-network
    working_dir: /app/packages/db
    environment:
      DATABASE_URL: postgresql://${SIM_POSTGRES_USER:-postgres}:${SIM_POSTGRES_PASSWORD}@sim-db:5432/${SIM_POSTGRES_DB:-simstudio}
    depends_on:
      sim-db:
        condition: service_healthy
    command: ["bun", "run", "db:migrate"]
    restart: "no"

  sim-approval-setup:
    image: pgvector/pgvector:pg17
    networks:
      - uiuc-chat-network
    environment:
      PGHOST: sim-db
      PGPORT: 5432
      PGUSER: ${SIM_POSTGRES_USER:-postgres}
      PGPASSWORD: ${SIM_POSTGRES_PASSWORD:?}
      PGDATABASE: ${SIM_POSTGRES_DB:-simstudio}
      SIM_APPROVAL_ADMIN_EMAIL: ${SIM_APPROVAL_ADMIN_EMAIL:-rohan13@illinois.edu}
    depends_on:
      sim-migrations:
        condition: service_completed_successfully
    entrypoint: /bin/sh
    command:
      - -lc
      - |
        set -eu
        psql \
          --set=ON_ERROR_STOP=1 \
          --set=approval_admin_email="$${SIM_APPROVAL_ADMIN_EMAIL}" <<'SQL'
        BEGIN;

        CREATE TABLE IF NOT EXISTS sim_user_approval (
          email text PRIMARY KEY,
          status text NOT NULL CHECK (status IN ('pending', 'approved', 'blocked')),
          is_admin boolean NOT NULL DEFAULT false,
          reason text,
          updated_at timestamptz NOT NULL DEFAULT now()
        );

        INSERT INTO sim_user_approval (email, status, is_admin, reason)
        VALUES (lower(:'approval_admin_email'), 'approved', true, NULL)
        ON CONFLICT (email) DO UPDATE SET
          status = 'approved',
          is_admin = true,
          reason = NULL,
          updated_at = now();

        INSERT INTO sim_user_approval (email, status, is_admin, reason)
        VALUES (
          'sim-sso-provider@localhost.invalid',
          'blocked',
          false,
          'Internal SSO provider owner'
        )
        ON CONFLICT (email) DO UPDATE SET
          status = 'blocked',
          is_admin = false,
          reason = 'Internal SSO provider owner',
          updated_at = now();

        INSERT INTO "user" (
          id,
          name,
          email,
          normalized_email,
          email_verified,
          created_at,
          updated_at,
          role,
          banned,
          ban_reason
        )
        VALUES (
          'sim-sso-provider-owner',
          'Sim SSO Provider',
          'sim-sso-provider@localhost.invalid',
          'sim-sso-provider@localhost.invalid',
          true,
          now(),
          now(),
          'user',
          true,
          'Internal SSO provider owner'
        )
        ON CONFLICT (email) DO NOTHING;

        INSERT INTO sim_user_approval (email, status, is_admin, reason)
        SELECT
          lower(email),
          CASE WHEN lower(email) = lower(:'approval_admin_email') THEN 'approved' ELSE 'pending' END,
          lower(email) = lower(:'approval_admin_email'),
          CASE
            WHEN lower(email) = lower(:'approval_admin_email') THEN NULL
            ELSE 'Pending admin approval'
          END
        FROM "user"
        ON CONFLICT (email) DO NOTHING;

        CREATE OR REPLACE FUNCTION apply_sim_user_approval()
        RETURNS trigger AS $$$$
        DECLARE
          approval sim_user_approval%ROWTYPE;
        BEGIN
          INSERT INTO sim_user_approval (email, status, is_admin, reason)
          VALUES (lower(NEW.email), 'pending', false, 'Pending admin approval')
          ON CONFLICT (email) DO NOTHING;

          SELECT * INTO approval
          FROM sim_user_approval
          WHERE email = lower(NEW.email);

          NEW.banned := approval.status <> 'approved';
          NEW.ban_reason := CASE WHEN NEW.banned THEN approval.reason ELSE NULL END;
          NEW.ban_expires := NULL;
          IF approval.is_admin THEN
            NEW.role := 'admin';
          END IF;
          RETURN NEW;
        END;
        $$$$ LANGUAGE plpgsql;

        CREATE OR REPLACE FUNCTION record_sim_user_approval()
        RETURNS trigger AS $$$$
        BEGIN
          IF NEW.banned IS DISTINCT FROM OLD.banned THEN
            INSERT INTO sim_user_approval (email, status, is_admin, reason)
            VALUES (
              lower(NEW.email),
              CASE WHEN NEW.banned THEN 'blocked' ELSE 'approved' END,
              NEW.role = 'admin',
              CASE WHEN NEW.banned THEN NEW.ban_reason ELSE NULL END
            )
            ON CONFLICT (email) DO UPDATE SET
              status = excluded.status,
              reason = excluded.reason,
              updated_at = now();
          END IF;
          RETURN NEW;
        END;
        $$$$ LANGUAGE plpgsql;

        DROP TRIGGER IF EXISTS record_sim_user_approval_on_user ON "user";

        UPDATE "user" AS users
        SET
          role = CASE WHEN approvals.is_admin THEN 'admin' ELSE users.role END,
          banned = approvals.status <> 'approved',
          ban_reason = CASE
            WHEN approvals.status = 'approved' THEN NULL
            ELSE approvals.reason
          END,
          ban_expires = NULL
        FROM sim_user_approval AS approvals
        WHERE lower(users.email) = approvals.email;

        DELETE FROM session
        WHERE user_id IN (
          SELECT users.id
          FROM "user" AS users
          JOIN sim_user_approval AS approvals ON approvals.email = lower(users.email)
          WHERE approvals.status <> 'approved'
        );

        DROP TRIGGER IF EXISTS apply_sim_user_approval_on_user ON "user";
        CREATE TRIGGER apply_sim_user_approval_on_user
        BEFORE INSERT ON "user"
        FOR EACH ROW
        EXECUTE FUNCTION apply_sim_user_approval();

        CREATE TRIGGER record_sim_user_approval_on_user
        AFTER UPDATE OF banned ON "user"
        FOR EACH ROW
        EXECUTE FUNCTION record_sim_user_approval();

        COMMIT;
        SQL
    restart: "no"

  sim-keycloak-setup:
    image: quay.io/keycloak/keycloak:26.1
    entrypoint: /bin/bash
    networks:
      - uiuc-chat-network
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      SIM_APP_URL: ${SIM_NEXT_PUBLIC_APP_URL:-http://localhost:3010}
      SIM_KEYCLOAK_CLIENT_ID: ${SIM_KEYCLOAK_CLIENT_ID:-simai}
      SIM_KEYCLOAK_CLIENT_SECRET: ${SIM_KEYCLOAK_CLIENT_SECRET:-simai-local-secret}
      SIM_SSO_PROVIDER_ID: ${SIM_SSO_PROVIDER_ID:-uiuc-keycloak}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-illinois_chat_realm}
    depends_on:
      keycloak:
        condition: service_healthy
    command:
      - -lc
      - |
        set -euo pipefail

        realm="$${NEXT_PUBLIC_KEYCLOAK_REALM}"
        app_url="$${SIM_APP_URL}"
        callback_url="$${app_url}/api/auth/sso/callback/$${SIM_SSO_PROVIDER_ID}"

        /opt/keycloak/bin/kcadm.sh config credentials \
          --server http://keycloak:8080 \
          --realm master \
          --user "$${KEYCLOAK_ADMIN_USERNAME}" \
          --password "$${KEYCLOAK_ADMIN_PASSWORD}" >/dev/null

        client_uuid="$$(/opt/keycloak/bin/kcadm.sh get clients -r "$${realm}" -q "clientId=$${SIM_KEYCLOAK_CLIENT_ID}" --fields id --format csv --noquotes | tail -n 1 | tr -d '\r')"
        if [ -z "$${client_uuid}" ]; then
          /opt/keycloak/bin/kcadm.sh create clients -r "$${realm}" \
            -s "clientId=$${SIM_KEYCLOAK_CLIENT_ID}" \
            -s enabled=true \
            -s protocol=openid-connect \
            -s publicClient=false \
            -s "secret=$${SIM_KEYCLOAK_CLIENT_SECRET}" \
            -s standardFlowEnabled=true \
            -s directAccessGrantsEnabled=false \
            -s 'redirectUris=["'"$${callback_url}"'"]' \
            -s 'webOrigins=["'"$${app_url}"'"]' >/dev/null
        else
          /opt/keycloak/bin/kcadm.sh update "clients/$${client_uuid}" -r "$${realm}" \
            -s enabled=true \
            -s publicClient=false \
            -s "secret=$${SIM_KEYCLOAK_CLIENT_SECRET}" \
            -s standardFlowEnabled=true \
            -s directAccessGrantsEnabled=false \
            -s 'redirectUris=["'"$${callback_url}"'"]' \
            -s 'webOrigins=["'"$${app_url}"'"]' >/dev/null
        fi
    restart: "no"

  sim-sso-setup:
    image: ghcr.io/simstudioai/migrations:${SIM_IMAGE_TAG:-latest}
    networks:
      - uiuc-chat-network
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${SIM_POSTGRES_USER:-postgres}:${SIM_POSTGRES_PASSWORD}@sim-db:5432/${SIM_POSTGRES_DB:-simstudio}
      NEXT_PUBLIC_APP_URL: ${SIM_NEXT_PUBLIC_APP_URL:-http://localhost:3010}
      BETTER_AUTH_URL: ${SIM_NEXT_PUBLIC_APP_URL:-http://localhost:3010}
      SSO_ENABLED: "true"
      SSO_PROVIDER_TYPE: oidc
      SSO_PROVIDER_ID: ${SIM_SSO_PROVIDER_ID:-uiuc-keycloak}
      SSO_ISSUER: http://localhost:8080/realms/${NEXT_PUBLIC_KEYCLOAK_REALM:-illinois_chat_realm}
      SSO_DOMAIN: ${SIM_SSO_DOMAIN:-illinois.edu,gmail.com}
      SSO_USER_EMAIL: sim-sso-provider@localhost.invalid
      SSO_OIDC_CLIENT_ID: ${SIM_KEYCLOAK_CLIENT_ID:-simai}
      SSO_OIDC_CLIENT_SECRET: ${SIM_KEYCLOAK_CLIENT_SECRET:-simai-local-secret}
      SSO_OIDC_SCOPES: openid,profile,email
      SSO_OIDC_PKCE: "false"
      SSO_OIDC_TOKEN_ENDPOINT_AUTH: client_secret_post
      SSO_OIDC_AUTHORIZATION_ENDPOINT: http://localhost:8080/realms/${NEXT_PUBLIC_KEYCLOAK_REALM:-illinois_chat_realm}/protocol/openid-connect/auth
      SSO_OIDC_TOKEN_ENDPOINT: http://keycloak:8080/realms/${NEXT_PUBLIC_KEYCLOAK_REALM:-illinois_chat_realm}/protocol/openid-connect/token
      SSO_OIDC_USERINFO_ENDPOINT: http://keycloak:8080/realms/${NEXT_PUBLIC_KEYCLOAK_REALM:-illinois_chat_realm}/protocol/openid-connect/userinfo
      SSO_OIDC_JWKS_ENDPOINT: http://keycloak:8080/realms/${NEXT_PUBLIC_KEYCLOAK_REALM:-illinois_chat_realm}/protocol/openid-connect/certs
      SSO_OIDC_DISCOVERY_ENDPOINT: http://keycloak:8080/realms/${NEXT_PUBLIC_KEYCLOAK_REALM:-illinois_chat_realm}/.well-known/openid-configuration
    depends_on:
      sim-approval-setup:
        condition: service_completed_successfully
      sim-keycloak-setup:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        bun run packages/db/scripts/register-sso-provider.ts
    restart: "no"

  sim-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "${SIM_POSTGRES_PORT:-55432}:5432"
    networks:
      - uiuc-chat-network
    environment:
      POSTGRES_USER: ${SIM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SIM_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${SIM_POSTGRES_DB:-simstudio}
    volumes:
      - sim-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SIM_POSTGRES_USER:-postgres} -d ${SIM_POSTGRES_DB:-simstudio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sim-postgres-data: {}
