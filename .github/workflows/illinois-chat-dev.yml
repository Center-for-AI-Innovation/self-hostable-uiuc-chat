name: Illinois Chat Dev Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/**'

# check-mode: push runs trunk without --github-annotate, so it needs no
# write scope -- results surface via the step's exit code. Declaring the
# block at all also drops every unlisted scope to none.
permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: |
          npm ci

      # Lint only the commits in this push (github.event.before..after), not
      # the whole tree -- main carries ~895 pre-existing issues from before it
      # was linted, and check-mode: all would fail on all of them forever.
      # These commits already passed the same linters as a PR diff, so this is
      # a cheap guard against anything that lands on main outside a PR.
      #
      # Non-frontend paths (apps/backend, infra, etc.) are ignored repo-wide
      # in .trunk/trunk.yaml for now, so this stays diff-only while only
      # ever surfacing frontend issues. Drop that ignore rule once those
      # trees are ready to be linted too.
      - name: Trunk Check (pushed commits only)
        uses: trunk-io/trunk-action@v1
        with:
          check-mode: push

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: uiuc-chat-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd apps/backend
          docker build -f Self-Hosted-Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:main \
            .

      - name: Push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: uiuc-chat-backend
        run: |
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

      - name: Build worker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_WORKER: uiuc-chat-worker
          WORKER_IMAGE_TAG: ${{ github.sha }}
        run: |
          cd apps/backend
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_WORKER:$WORKER_IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_WORKER:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_WORKER:main \
            ai_ta_backend/rabbitmq/

      - name: Push worker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_WORKER: uiuc-chat-worker
        run: |
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY_WORKER

      - name: Build frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: uiuc-chat-frontend
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_KEYCLOAK_URL: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_URL }}
          NEXT_PUBLIC_KEYCLOAK_REALM: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_REALM }}
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_API_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_USE_ILLINOIS_CHAT_CONFIG: ${{ vars.NEXT_PUBLIC_USE_ILLINOIS_CHAT_CONFIG || 'True' }}
          NEXT_PUBLIC_ILLINOIS_CHAT_BANNER_CONTENT: ${{ vars.NEXT_PUBLIC_ILLINOIS_CHAT_BANNER_CONTENT }}
        run: |
          cd apps/frontend

          # See release-images.yml: NEXT_PUBLIC_* is baked in at build time and cannot be
          # fixed at runtime, so an empty or slash-less Keycloak URL must fail the build.
          if [ -z "$NEXT_PUBLIC_KEYCLOAK_URL" ]; then
            echo "::error::NEXT_PUBLIC_KEYCLOAK_URL is empty; JWT issuer would fall back to the Host header."
            exit 1
          fi
          case "$NEXT_PUBLIC_KEYCLOAK_URL" in
            */) ;;
            *) echo "::error::NEXT_PUBLIC_KEYCLOAK_URL must end with a trailing slash."; exit 1 ;;
          esac

          docker build --platform=linux/amd64 -f Dockerfile \
            --build-arg NEXT_PUBLIC_KEYCLOAK_URL="$NEXT_PUBLIC_KEYCLOAK_URL" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_REALM="$NEXT_PUBLIC_KEYCLOAK_REALM" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_CLIENT_ID="$NEXT_PUBLIC_KEYCLOAK_CLIENT_ID" \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY="$NEXT_PUBLIC_POSTHOG_KEY" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="$NEXT_PUBLIC_POSTHOG_HOST" \
            --build-arg NEXT_PUBLIC_USE_ILLINOIS_CHAT_CONFIG="$NEXT_PUBLIC_USE_ILLINOIS_CHAT_CONFIG" \
            --build-arg NEXT_PUBLIC_ILLINOIS_CHAT_BANNER_CONTENT="$NEXT_PUBLIC_ILLINOIS_CHAT_BANNER_CONTENT" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:main \
            .

      - name: Push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: uiuc-chat-frontend
        run: |
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

      - name: Build crawlee image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: uiuc-chat-crawlee
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd apps/crawlee
          docker build -f Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:main \
            .

      - name: Push crawlee image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: uiuc-chat-crawlee
        run: |
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

      - name: Update ECS services
        env:
          CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
          FRONTEND_SERVICE_NAME: ${{ secrets.ECS_FRONTEND_SERVICE_NAME }}
          BACKEND_SERVICE_NAME: ${{ secrets.ECS_BACKEND_SERVICE_NAME }}
          WORKER_SERVICE_NAME: ${{ secrets.ECS_WORKER_SERVICE_NAME }}
          CRAWLEE_SERVICE_NAME: ${{ secrets.ECS_CRAWLEE_SERVICE_NAME }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "$FRONTEND_SERVICE_NAME" --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "$BACKEND_SERVICE_NAME" --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "$WORKER_SERVICE_NAME" --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "$CRAWLEE_SERVICE_NAME" --force-new-deployment
